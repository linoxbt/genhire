# Netlify build + serve configuration for the GenHire frontend.
#
# The app is a fully static SPA: it talks to the GenLayer RPC directly from the
# browser via genlayer-js, so there is nothing to run server-side here - no
# functions, no edge handlers, no origin API to proxy.

[build]
  base = "frontend"
  command = "npm run build"
  # Given from the repository root, NOT relative to `base` - Netlify resolves
  # `publish` against the repo root even when a base directory is set, and a
  # bare "dist" here sends it looking in /dist for a build that landed in
  # /frontend/dist.
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's default is npm ci, which needs the lockfile to match exactly.
  NPM_FLAGS = "--no-audit --no-fund"

# Client-side routes like /job/3 or /profile/0x… must not 404 on a direct load
# or a refresh. This has to come after any more specific rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints everything under /assets, so those are safe to cache
# permanently; the HTML entry point must never be, or a deploy would not reach
# anyone still holding a cached index.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # This app holds no secrets and reads no cross-origin state, but a wallet
    # connection makes clickjacking worth closing off explicitly.
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"

[context.production.environment]
  NODE_ENV = "production"

# Deploy previews and branch builds hit the same public networks; nothing here
# is environment-specific beyond the contract address, which is set as a site
# environment variable rather than committed.
